name: Release Windows x64

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest # x64 host -> x64 build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.5.0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          # Version bumps change Cargo.lock's hash → exact key misses every release.
          # Fall back to the newest prior cargo cache so deps + target are reused.
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify version agreement
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "pkg=$PKG conf=$CONF cargo=$CARGO ref=$GITHUB_REF_NAME"
          if [ "$PKG" != "$CONF" ] || [ "$PKG" != "$CARGO" ]; then
            echo "::error::version drift — run npm run bump <ver>"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match v$PKG"; exit 1
          fi
          if gh release view "v$PKG" >/dev/null 2>&1; then
            echo "::error::release v$PKG already exists — bump first"; exit 1
          fi

      - name: Require signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: '[ -n "$KEY" ] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY missing"; exit 1; }'

      - name: Install deps
        run: npm ci

      # bash, not the default pwsh: pwsh only fails on the last command's exit code.
      - name: Gate on tests
        shell: bash
        run: |
          npm run check
          npm run lint
          npm run test:vitest
          cargo test --locked --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Zzlepuh v__VERSION__'
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc -- --locked
